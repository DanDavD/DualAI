# DualAI Zero-Trust Cloud Gateway - Fly.io Production Deployment Manifest (CARD-18)
app = "dualai-cloud-gateway"
primary_region = "dfw"

kill_signal = "SIGTERM"
kill_timeout = "15s"

[build]
  dockerfile = "server/Dockerfile"

[env]
  NODE_ENV = "production"
  GATEWAY_HOST = "0.0.0.0"
  PORT = "8787"

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "connections"
    hard_limit = 500
    soft_limit = 400

  [[http_service.checks]]
    grace_period = "10s"
    interval = "20s"
    method = "GET"
    timeout = "5s"
    path = "/v1/health"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
