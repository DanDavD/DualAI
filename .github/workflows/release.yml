name: Build and Release DualAI Desktop Installers

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-desktop:
    name: Build ${{ matrix.os }} Installer
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            build_cmd: pnpm run build && npx electron-builder --mac --publish never
            artifact_glob: dist/DualAI-*.dmg
          - os: windows-latest
            build_cmd: pnpm run build && npx electron-builder --win --publish never
            artifact_glob: dist/DualAI-*-setup.exe

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck and Production Bundle
        env:
          VITE_GATEWAY_URL: ${{ vars.VITE_GATEWAY_URL || 'https://api.universalaisync.com' }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || '' }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY || '' }}
        run: |
          pnpm run typecheck
          pnpm run build
          pnpm run security:gate

      - name: Package Native Desktop Installer
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          VITE_GATEWAY_URL: ${{ vars.VITE_GATEWAY_URL || 'https://api.universalaisync.com' }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || '' }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY || '' }}
        run: ${{ matrix.build_cmd }}

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dualai-installer-${{ matrix.os }}
          path: ${{ matrix.artifact_glob }}
          if-no-files-found: error

      - name: Publish to GitHub Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact_glob }}
          draft: false
          prerelease: false
